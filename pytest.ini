[pytest]
# Cible uniquement la vraie suite de tests. Sans ce fichier, "pytest" lancé sans argument
# depuis la racine tente aussi de collecter les scripts procéduraux de la racine
# (test_e2e_parallel.py, test_e2e_subprocess.py, test_path_resolver.py) — ce ne sont pas des
# tests pytest, et test_path_resolver.py fait planter la collecte (sys.exit() au niveau module).
# Ces scripts restent exécutables directement : `python test_e2e_subprocess.py`.
testpaths = tests
